services:
  postgres:
    image: postgres:17
    container_name: kpv_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1469
      POSTGRES_DB: kpv_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kpv_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kpv_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  registration:
    build:
      context: ./FifthHomework/Registration
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=kpv_db;Username=postgres;Password=1469
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kpv_network

  approval:
    build:
      context: ./SixthHomework/Approval
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=kpv_db;Username=postgres;Password=1469
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kpv_network

volumes:
  postgres_data:
    driver: local

networks:
  kpv_network:
    driver: bridge
